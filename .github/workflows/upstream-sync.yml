name: Reusable Upstream Sync & Validate

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/repo)'
        required: true
        type: string
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: false
        type: string
        default: 'main'
      target_branch:
        description: 'Target branch to update in this repo'
        required: false
        type: string
        default: 'main'
      python_version:
        description: 'Python version to set up'
        required: false
        type: string
        default: '3.12'
      preflight_command:
        description: 'Optional shell command to execute for preflight/syntax checks after merge'
        required: false
        type: string
        default: ''
      test_command:
        description: 'Optional shell command to execute test suite after merge'
        required: false
        type: string
        default: ''
      post_merge_workflow:
        description: 'Optional name of a workflow in the calling repository to trigger after pushing (e.g. docker-publish.yml)'
        required: false
        type: string
        default: ''
      submodules:
        description: 'Checkout submodules option (false, true, recursive)'
        required: false
        type: string
        default: 'false'
      workflow_sync_policy:
        description: 'How to handle upstream .github/workflows changes when SYNC_TOKEN is not set (preserve_if_no_pat | fail_on_workflow_diff)'
        required: false
        type: string
        default: 'preserve_if_no_pat'
      dry_run:
        description: 'Validate sync and conflict resolution without pushing or opening issues/PRs'
        required: false
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        description: 'Google Gemini API key for automated merge conflict resolution'
        required: false
      SYNC_TOKEN:
        description: 'Optional PAT with repo + workflow scope so .github/workflows updates push directly'
        required: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: upstream-sync-${{ github.repository }}-${{ inputs.target_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      UPSTREAM_REPO: ${{ inputs.upstream_repo }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORKFLOW_SYNC_POLICY: ${{ inputs.workflow_sync_policy }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Fetch Workflow Toolkit
        run: |
          git clone --depth=1 https://github.com/MarkenJaden/workflows.git /tmp/workflow-tools

      - name: Fetch upstream and inspect sync plan
        id: plan
        run: |
          set -euo pipefail
          echo "Fetching upstream https://github.com/${UPSTREAM_REPO}.git (${UPSTREAM_BRANCH})..."
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          UPSTREAM_HEAD=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          GIT_MERGE_BASE=$(git merge-base HEAD "${UPSTREAM_HEAD}" || true)

          # Check for previous non-workflow patch sync markers recorded as commit trailers.
          SYNC_TRAILER_SHA=""
          while IFS= read -r raw_sha; do
            sha=$(echo "$raw_sha" | tr -d '[:space:]')
            if [ -n "$sha" ] && git cat-file -e "${sha}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" "${UPSTREAM_HEAD}" 2>/dev/null; then
              SYNC_TRAILER_SHA="$sha"
              break
            fi
          done < <(git log -n 80 --format='%(trailers:key=Upstream-Sync-Commit,valueonly)' HEAD || true)

          SYNC_BASE="${GIT_MERGE_BASE}"
          if [ -n "${SYNC_TRAILER_SHA}" ]; then
            if [ -z "${SYNC_BASE}" ] || git merge-base --is-ancestor "${SYNC_BASE}" "${SYNC_TRAILER_SHA}" 2>/dev/null; then
              SYNC_BASE="${SYNC_TRAILER_SHA}"
            fi
          fi

          if [ "${SYNC_BASE}" = "${UPSTREAM_HEAD}" ]; then
            echo "Already up to date with upstream (${UPSTREAM_HEAD:0:10})."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "upstream_head=${UPSTREAM_HEAD}" >> "$GITHUB_OUTPUT"
          echo "sync_base=${SYNC_BASE}" >> "$GITHUB_OUTPUT"

          if [ -n "${SYNC_BASE}" ]; then
            COMMIT_COUNT=$(git rev-list --count "${SYNC_BASE}..${UPSTREAM_HEAD}")
          else
            COMMIT_COUNT=$(git rev-list --count "${UPSTREAM_HEAD}")
          fi
          echo "Pending upstream commits: ${COMMIT_COUNT}"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

          # GitHub rejects pushing commits that modify .github/workflows/* when only GITHUB_TOKEN is used.
          WORKFLOW_FILES=""
          if [ "${HAS_SYNC_TOKEN}" != "true" ]; then
            if [ -n "${GIT_MERGE_BASE}" ]; then
              WORKFLOW_FILES=$(git diff --name-only "${GIT_MERGE_BASE}..${UPSTREAM_HEAD}" -- .github/workflows || true)
            else
              WORKFLOW_FILES=$(git ls-tree -r --name-only "${UPSTREAM_HEAD}" -- .github/workflows || true)
            fi
          fi

          if [ -n "${WORKFLOW_FILES}" ]; then
            echo "${WORKFLOW_FILES}" > /tmp/skipped_workflows.txt
            echo "workflows_touched=true" >> "$GITHUB_OUTPUT"
            if [ "${WORKFLOW_SYNC_POLICY}" = "fail_on_workflow_diff" ]; then
              echo "::error::Upstream changes touch .github/workflows/* and SYNC_TOKEN secret is not configured."
              echo "sync_mode=merge" >> "$GITHUB_OUTPUT"
            else
              echo "Upstream history touches .github/workflows/* without SYNC_TOKEN; using workflow-safe 3-way patch mode."
              echo "sync_mode=patch_skip_workflows" >> "$GITHUB_OUTPUT"
            fi
          else
            rm -f /tmp/skipped_workflows.txt
            echo "workflows_touched=false" >> "$GITHUB_OUTPUT"
            echo "sync_mode=merge" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt upstream merge or workflow-safe patch sync
        id: attempt_merge
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          SYNC_MODE="${{ steps.plan.outputs.sync_mode }}"
          UPSTREAM_HEAD="${{ steps.plan.outputs.upstream_head }}"
          SYNC_BASE="${{ steps.plan.outputs.sync_base }}"
          SHORT_SHA="${UPSTREAM_HEAD:0:10}"

          if [ "${SYNC_MODE}" = "merge" ]; then
            echo "Attempting git merge upstream/${UPSTREAM_BRANCH} into ${TARGET_BRANCH}..."
            if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            else
              echo "Merge conflict detected."
              echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # patch_skip_workflows mode (GITHUB_TOKEN cannot push .github/workflows/* modifications)
          if [ -z "${SYNC_BASE}" ]; then
            echo "::error::Cannot apply workflow-safe patch without a common ancestor commit. Add SYNC_TOKEN secret or merge upstream locally once."
            echo "merge_status=failed_unmergeable" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Generating non-workflow 3-way diff ${SYNC_BASE:0:10}..${SHORT_SHA}..."
          git diff --binary --full-index -M "${SYNC_BASE}..${UPSTREAM_HEAD}" -- . ':!.github/workflows' > /tmp/upstream-sync.patch

          if [ ! -s /tmp/upstream-sync.patch ]; then
            echo "Only .github/workflows files changed upstream; recording sync marker."
            git commit --allow-empty \
              -m "chore(sync): mark ${UPSTREAM_REPO}@${SHORT_SHA} synced (workflows skipped)" \
              -m "Upstream-Sync-Commit: ${UPSTREAM_HEAD}"
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git apply --3way --index /tmp/upstream-sync.patch; then
            if git diff --cached --quiet; then
              git commit --allow-empty \
                -m "chore(sync): sync ${UPSTREAM_REPO}@${SHORT_SHA} (changes already present)" \
                -m "Upstream-Sync-Commit: ${UPSTREAM_HEAD}"
            else
              git commit \
                -m "chore(sync): sync non-workflow changes from ${UPSTREAM_REPO}@${SHORT_SHA}" \
                -m "Upstream-Sync-Commit: ${UPSTREAM_HEAD}"
            fi
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            UNMERGED=$(git diff --name-only --diff-filter=U || true)
            if [ -n "${UNMERGED}" ]; then
              echo "3-way patch conflict detected; passing unmerged index to conflict resolver."
              echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            else
              echo "::error::git apply --3way failed without unmerged conflict markers."
              echo "merge_status=failed_unmergeable" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Auto-resolve conflicts
        id: gemini_resolve
        if: steps.attempt_merge.outputs.merge_status == 'conflict'
        env:
          UPSTREAM_BASE: ${{ steps.plan.outputs.sync_base }}
          CONFLICT_REPORT_PATH: /tmp/conflict-report.json
        run: |
          UPSTREAM_HEAD="${{ steps.plan.outputs.upstream_head }}"
          if [ "${{ steps.plan.outputs.sync_mode }}" = "patch_skip_workflows" ]; then
            export SYNC_COMMIT_TRAILER="Upstream-Sync-Commit: ${UPSTREAM_HEAD}"
          fi
          if python3 /tmp/workflow-tools/scripts/gemini_conflict_resolver.py; then
            echo "All merge conflicts resolved cleanly!"
            echo "resolve_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Conflict resolver could not finish all files automatically."
            echo "resolve_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle unresolved merge conflict
        if: steps.attempt_merge.outputs.merge_status == 'conflict' && steps.gemini_resolve.outputs.resolve_status != 'success'
        run: |
          SAFE_TARGET=$(echo "${TARGET_BRANCH}" | tr '/:' '-')
          BRANCH_NAME="upstream-sync/conflict-${SAFE_TARGET}"
          UNMERGED=$(git diff --name-only --diff-filter=U || true)

          echo "### Upstream Sync Conflict Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${TARGET_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unresolved files:" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r uf; do
            [ -n "$uf" ] && echo "  - \`${uf}\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${UNMERGED}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run enabled; skipping conflict branch push / PR creation."
            exit 1
          fi

          # Preserve fork changes AND partial resolutions on rolling conflict branch (never abort to raw upstream!)
          git add -u || true
          git commit --allow-empty -m "wip(sync): unresolved upstream conflicts for ${TARGET_BRANCH} (${UPSTREAM_BRANCH})" || true
          git checkout -B "${BRANCH_NAME}"

          PUSH_OK=false
          if git push origin "${BRANCH_NAME}" --force; then
            PUSH_OK=true
          fi

          BODY=$(cat <<EOF
          Automated sync from \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\` into \`${TARGET_BRANCH}\` encountered conflicts that could not be auto-resolved cleanly.

          Fork features and any auto-resolved files were preserved on branch \`${BRANCH_NAME}\` (do **not** reset to upstream).

          ### Unresolved files
          \`\`\`
          ${UNMERGED}
          \`\`\`

          To resolve manually:
          \`\`\`bash
          git fetch origin ${BRANCH_NAME}
          git checkout ${BRANCH_NAME}
          # resolve markers, test, then merge into ${TARGET_BRANCH}
          \`\`\`
          EOF
          )

          if [ "${PUSH_OK}" = "true" ]; then
            EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number' || true)
            if [ -n "${EXISTING_PR}" ]; then
              gh pr comment "${EXISTING_PR}" --repo "${{ github.repository }}" --body "${BODY}" || true
            else
              gh pr create \
                --repo "${{ github.repository }}" \
                --title "Upstream Sync Conflict (${TARGET_BRANCH})" \
                --body "${BODY}" \
                --base "${TARGET_BRANCH}" \
                --head "${BRANCH_NAME}" || true
            fi
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Upstream Sync Conflict (${TARGET_BRANCH})" \
              --body "${BODY}" || echo "::warning::Could not create PR/Issue via GitHub CLI."
          fi
          exit 1

      - name: Run preflight checks
        if: (steps.attempt_merge.outputs.merge_status == 'clean' || steps.gemini_resolve.outputs.resolve_status == 'success') && inputs.preflight_command != ''
        env:
          CMD: ${{ inputs.preflight_command }}
        run: |
          echo "Running configured preflight checks..."
          bash -eo pipefail -c "$CMD"

      - name: Run test suite
        if: (steps.attempt_merge.outputs.merge_status == 'clean' || steps.gemini_resolve.outputs.resolve_status == 'success') && inputs.test_command != ''
        env:
          CMD: ${{ inputs.test_command }}
        run: |
          echo "Running configured test suite..."
          bash -eo pipefail -c "$CMD"

      - name: Push merged changes and publish summary
        if: steps.attempt_merge.outputs.merge_status == 'clean' || steps.gemini_resolve.outputs.resolve_status == 'success'
        run: |
          set -euo pipefail
          SYNC_MODE="${{ steps.plan.outputs.sync_mode }}"
          UPSTREAM_HEAD="${{ steps.plan.outputs.upstream_head }}"

          echo "### Upstream Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\` @ \`${UPSTREAM_HEAD:0:10}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target branch: \`${TARGET_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sync mode: \`${SYNC_MODE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream commits synced: \`${{ steps.plan.outputs.commit_count }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/conflict-report.json ]; then
            echo "- Auto-resolved conflicts:" >> "$GITHUB_STEP_SUMMARY"
            python3 -c '
          import json
          r = json.load(open("/tmp/conflict-report.json"))
          for f in r.get("resolved", []):
              print(f"  - `{f}`")
          ' >> "$GITHUB_STEP_SUMMARY" || true
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "- Status: **Dry-run passed** (push skipped)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Pushing synced commit to origin/${TARGET_BRANCH}..."
          if ! git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
            echo "Initial push failed; retrying after fetching origin/${TARGET_BRANCH}..."
            exit 1
          fi

          # Clean up stale rolling conflict branch/PR if sync succeeded
          SAFE_TARGET=$(echo "${TARGET_BRANCH}" | tr '/:' '-')
          CONFLICT_BRANCH="upstream-sync/conflict-${SAFE_TARGET}"
          if git ls-remote --exit-code --heads origin "${CONFLICT_BRANCH}" >/dev/null 2>&1; then
            EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "${CONFLICT_BRANCH}" --state open --json number --jq '.[0].number' || true)
            if [ -n "${EXISTING_PR}" ]; then
              gh pr close "${EXISTING_PR}" --repo "${{ github.repository }}" --comment "Superseded: \`${TARGET_BRANCH}\` synced cleanly with \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\`." || true
            fi
            git push origin --delete "${CONFLICT_BRANCH}" || true
          fi

          if [ -f /tmp/skipped_workflows.txt ]; then
            SKIPPED_LIST=$(cat /tmp/skipped_workflows.txt)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Upstream \`.github/workflows/*\` files were skipped because \`SYNC_TOKEN\` secret is not configured:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r wf; do
              [ -n "$wf" ] && echo "> - \`${wf}\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "${SKIPPED_LIST}"

            ISSUE_TITLE="[upstream-sync] Skipped .github/workflows updates on ${TARGET_BRANCH}"
            EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"${ISSUE_TITLE}\"" --state open --json number --jq '.[0].number' || true)
            ISSUE_BODY=$(cat <<EOF
          Upstream sync from \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\` (@ \`${UPSTREAM_HEAD:0:10}\`) succeeded for all application code, but skipped modifying \`.github/workflows/*\` because \`GITHUB_TOKEN\` does not have \`workflow\` push permission:

          \`\`\`
          ${SKIPPED_LIST}
          \`\`\`

          To let future automated syncs merge workflow changes directly too:
          1. Create a PAT with \`repo\` + \`workflow\` scope.
          2. Add it as repository secret \`SYNC_TOKEN\`.
          3. Or review and copy upstream workflow changes manually when needed.
          EOF
          )
            if [ -z "${EXISTING_ISSUE}" ]; then
              gh issue create --repo "${{ github.repository }}" --title "${ISSUE_TITLE}" --body "${ISSUE_BODY}" || true
            fi
          fi

          if [ -n "${{ inputs.post_merge_workflow }}" ]; then
            echo "Triggering post-merge workflow ${{ inputs.post_merge_workflow }}..."
            gh workflow run "${{ inputs.post_merge_workflow }}" --repo "${{ github.repository }}" --ref "${TARGET_BRANCH}" || true
          fi
